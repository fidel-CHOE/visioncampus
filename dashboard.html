<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Campus — Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap');
:root{
  --navy:#2D3A5C;--navy-dark:#1e2840;--amber:#E07B39;
  --green:#1D9E75;--bg:#F7F6F2;--surface:#fff;
  --text:#1A1A2E;--muted:#7A7A8C;--border:#E2E0D8;
  --nav-w:248px;--nav-bg:#1e2840;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);height:100vh;display:flex;overflow:hidden;}

/* ── 사이드바 ── */
.sidebar{width:var(--nav-w);background:var(--nav-bg);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden;}
.sidebar-header{padding:18px 14px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.brand-icon{width:30px;height:30px;background:var(--amber);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-icon svg{width:16px;height:16px;}
.brand-name{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:#fff;line-height:1.2;}
.brand-sub{font-size:9px;color:rgba(255,255,255,.3);font-family:'Space Grotesk',sans-serif;}

.nav-section{flex:1;overflow-y:auto;padding:10px 6px 6px;}
.nav-section::-webkit-scrollbar{width:3px;}
.nav-section::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

.nav-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1px;padding:4px 8px 5px;margin-top:6px;}

/* ── 고정 nav-item ── */
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;cursor:pointer;color:rgba(255,255,255,.55);font-size:12px;font-weight:400;transition:all .13s;text-decoration:none;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.88);}
.nav-item.active{background:rgba(224,123,57,.18);color:#fff;}
.nav-item .ni-icon{width:15px;height:15px;opacity:.6;flex-shrink:0;}
.nav-item.active .ni-icon{opacity:1;}
.nav-item .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);margin-left:auto;display:none;flex-shrink:0;}
.nav-item.active .dot{display:block;}

/* ── 동적 트리 ── */
.tree-wrap{margin-top:2px;}
.tree-node{position:relative;}
.tree-row{display:flex;align-items:center;border-radius:5px;transition:background .12s;position:relative;}
.tree-row:hover{background:rgba(255,255,255,.05);}
.tree-row:hover .node-actions{opacity:1;}

.node-btn{display:flex;align-items:center;gap:6px;flex:1;padding:5px 6px;background:none;border:none;cursor:pointer;text-align:left;min-width:0;}
.node-chevron{font-size:8px;color:rgba(255,255,255,.3);transition:transform .16s;flex-shrink:0;width:12px;}
.node-chevron.open{transform:rotate(90deg);}
.node-icon{font-size:12px;flex-shrink:0;}
.node-label{font-size:11.5px;color:rgba(255,255,255,.6);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .12s;}
.tree-row:hover .node-label{color:rgba(255,255,255,.88);}
.tree-row.active-row .node-label{color:var(--amber);}
.tree-row.active-row{background:rgba(224,123,57,.1);}

/* 파일(terminal) 노드 들여쓰기 점 */
.file-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0;margin-right:2px;}
.tree-row.active-row .file-dot{background:var(--amber);}

/* 호버 시 나타나는 액션 버튼 */
.node-actions{opacity:0;display:flex;align-items:center;gap:1px;padding-right:4px;flex-shrink:0;transition:opacity .12s;}
.na-btn{width:18px;height:18px;border-radius:3px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.35);transition:all .12s;}
.na-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
.na-btn.del:hover{background:rgba(192,57,43,.3);color:#ff8a80;}

/* 자식 노드 컨테이너 */
.tree-children{display:none;padding-left:14px;}
.tree-children.open{display:block;}

/* ── 드래그앤드롭 ── */
.drag-handle{
  width:14px;height:20px;display:flex;align-items:center;justify-content:center;
  cursor:grab;flex-shrink:0;opacity:0;transition:opacity .12s;
  color:rgba(255,255,255,.3);font-size:11px;padding-left:2px;
}
.tree-row:hover .drag-handle{opacity:1;}
.drag-handle:active{cursor:grabbing;}
.tree-node.dragging{opacity:.35;}
/* 드롭 위치 인디케이터 */
.drop-line{
  height:2px;background:var(--amber);border-radius:1px;
  margin:1px 4px;display:none;pointer-events:none;
}
.drop-line.show{display:block;}
/* 폴더 드롭 대상 강조 */
.tree-row.drop-target{
  background:rgba(224,123,57,.15) !important;
  outline:1px dashed rgba(224,123,57,.4);
  border-radius:5px;
}

/* 푸터 */
.sidebar-footer{padding:10px 6px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.footer-btn{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:6px;cursor:pointer;color:rgba(255,255,255,.32);font-size:11px;background:none;border:none;width:100%;transition:all .13s;}
.footer-btn:hover{color:rgba(255,255,255,.65);background:rgba(255,255,255,.05);}
.footer-btn.export-btn{color:rgba(29,158,117,.7);}
.footer-btn.export-btn:hover{color:#1D9E75;background:rgba(29,158,117,.1);}

/* ── 메인 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0;}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--navy);}
.page-badge{font-size:10px;background:rgba(29,158,117,.12);color:var(--green);padding:2px 8px;border-radius:20px;font-weight:500;}
.content-frame{flex:1;overflow:hidden;}
.content-frame iframe{width:100%;height:100%;border:none;}

/* ── 모달 ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .18s;}
.overlay.show{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:11px;padding:22px 24px;width:400px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.18);transform:translateY(6px);transition:transform .18s;}
.overlay.show .modal{transform:translateY(0);}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--navy);margin-bottom:16px;}
.modal label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);outline:none;margin-bottom:12px;transition:border-color .15s;}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--navy);background:#fff;}
.modal-hint{font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:12px;line-height:1.5;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.btn-del{padding:8px 12px;border-radius:7px;border:1px solid rgba(192,57,43,.25);background:rgba(192,57,43,.06);color:#C0392B;font-size:12px;cursor:pointer;margin-right:auto;}
.btn-del:hover{background:rgba(192,57,43,.12);}
.btn-cancel{padding:8px 15px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12.5px;cursor:pointer;}
.btn-cancel:hover{border-color:var(--navy);color:var(--navy);}
.btn-save{padding:8px 18px;border-radius:7px;border:none;background:var(--navy);color:#fff;font-size:12.5px;font-weight:500;cursor:pointer;}
.btn-save:hover{background:#3a4a74;}

/* 내보내기 모달 */
.export-box{width:100%;height:200px;font-size:10.5px;font-family:monospace;resize:vertical;background:#f4f3ef;border:1.5px solid var(--border);border-radius:7px;padding:10px;color:var(--text);outline:none;}
.copy-tip{font-size:11px;color:var(--green);margin-top:6px;}

/* 타입 선택 라디오 */
.type-row{display:flex;gap:10px;margin-bottom:12px;}
.type-opt{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12.5px;color:var(--text);}
.type-opt input{width:14px;height:14px;cursor:pointer;accent-color:var(--navy);}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-header">
    <a href="index.html" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 18 18" fill="none">
          <path d="M9 2L15 5.5V12.5L9 16L3 12.5V5.5L9 2Z" stroke="white" stroke-width="1.2" fill="none"/>

  <div class="nav-section">

</nav>

<!-- 메인 -->
<div class="main">
  <div class="topbar">
    <span class="page-title" id="top-title">인생 로드맵</span>
    <span class="page-badge" id="top-badge">WBS v2</span>

<!-- 모달 -->

<script>
// ── 인증 ──
if(sessionStorage.getItem('vc_auth')!=='1') window.location.href='admin.html';

// ══════════════════════════════
// 기본 트리 데이터
// ══════════════════════════════
const DEFAULT_TREE = [
  { id:'f1', type:'folder', label:'AI 강의', open:false, icon:'🤖', children:[
    { id:'f1-1', type:'file', label:'바이브코딩', url:'lectures/ai-vibecoding.html', icon:'📄' },
    { id:'f1-2', type:'file', label:'파이썬', url:'lectures/ai-python.html', icon:'📄' },
  ]},
  { id:'f2', type:'folder', label:'경제/재테크 강의', open:false, icon:'📈', children:[
    { id:'f2-1', type:'file', label:'퇴직자 대상', url:'lectures/econ-retiree.html', icon:'📄' },
    { id:'f2-2', type:'file', label:'직장인 대상', url:'lectures/econ-worker.html', icon:'📄' },
  ]},
  { id:'f3', type:'folder', label:'사람에 대한 이해', open:false, icon:'🔍', children:[
    { id:'f3-1', type:'file', label:'강점혁명', url:'lectures/people-strengths.html', icon:'📄' },
    { id:'f3-2', type:'file', label:'버크만', url:'lectures/people-birkman.html', icon:'📄' },
    { id:'f3-3', type:'file', label:'뇌파와 MBTI', url:'lectures/people-brain-mbti.html', icon:'📄' },
  ]},
  { id:'f4', type:'folder', label:'저자 강연', open:false, icon:'📚', children:[
    { id:'f4-1', type:'folder', label:'시작의 자격', open:false, icon:'📁', children:[
      { id:'f4-1-1', type:'file', label:'0611 저자강연', url:'lecture/talk_0611.html', icon:'📄' },
      { id:'f4-1-2', type:'file', label:'0613 출간기념회', url:'lecture/talk_0613.html', icon:'📄' },
    ]},
    { id:'f4-2', type:'folder', label:'외부 강의', open:false, icon:'📁', children:[
      { id:'f4-2-1', type:'file', label:'DMS 임원워크샵', url:'lecture/dms_workshop.html', icon:'📄' },
    ]},
  ]},
];

// ── 스토리지 ──
function loadTree(){
  try{ const s=localStorage.getItem('vc_tree'); return s?JSON.parse(s):null; }
  catch{ return null; }
}
function saveTree(){ localStorage.setItem('vc_tree',JSON.stringify(TREE)); }

let TREE = loadTree() || JSON.parse(JSON.stringify(DEFAULT_TREE));
let _activeId = null;

// ── ID 생성 ──
function genId(){ return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }

// ── 트리 탐색 헬퍼 ──
function findNode(id, nodes){
  for(const n of nodes){
    if(n.id===id) return {node:n, parent:null, parentArr:nodes, idx:nodes.indexOf(n)};
    if(n.children){
      const r=findNode(id,n.children);
      if(r){ if(!r.parent) r.parent=n; return r; }
    }
  }
  return null;
}

// ══════════════════════════════
// 렌더링
// ══════════════════════════════
function renderTree(){
  const root=document.getElementById('tree-root');
  root.innerHTML='';
  TREE.forEach(n=>root.appendChild(buildNode(n,0)));
}

function buildNode(node, depth){
  const wrap=document.createElement('div');
  wrap.className='tree-node';
  wrap.dataset.id=node.id;
  wrap.dataset.depth=depth;

  // 드롭 인디케이터 (위)
  const dropAbove=document.createElement('div');
  dropAbove.className='drop-line';
  dropAbove.dataset.dropPos='above';
  dropAbove.dataset.targetId=node.id;
  wrap.appendChild(dropAbove);

  const row=document.createElement('div');
  row.className='tree-row'+(node.id===_activeId?' active-row':'');
  row.style.paddingLeft=(depth*10)+'px';
  row.draggable=true;
  row.dataset.nodeId=node.id;

  // 드래그 핸들
  const handle=document.createElement('span');
  handle.className='drag-handle';
  handle.innerHTML='⠿';
  handle.title='드래그하여 이동';
  row.appendChild(handle);

  if(node.type==='folder'){
    const inner=document.createElement('div');
    inner.style.cssText='display:flex;align-items:center;gap:6px;flex:1;min-width:0;';
    inner.innerHTML=`
      <button class="node-btn" style="padding:5px 4px;" onclick="toggleFolder('${node.id}')">
        <span class="node-chevron${node.open?' open':''}">▶</span>
        <span class="node-icon">${node.icon||'📁'}</span>
        <span class="node-label">${esc(node.label)}</span>
      </button>`;
    const actions=document.createElement('div');
    actions.className='node-actions';
    actions.innerHTML=`
      <button class="na-btn" title="하위 항목 추가" onclick="openAddChild('${node.id}')">+</button>
      <button class="na-btn" title="편집" onclick="openEdit('${node.id}')">✎</button>
      <button class="na-btn del" title="삭제" onclick="deleteNode('${node.id}')">✕</button>`;
    row.appendChild(inner);
    row.appendChild(actions);
  } else {
    const inner=document.createElement('div');
    inner.style.cssText='display:flex;align-items:center;gap:6px;flex:1;min-width:0;';
    inner.innerHTML=`
      <button class="node-btn" style="padding:5px 4px;" onclick="loadFile('${node.id}','${esc(node.label)}','${esc(node.url||'')}')">
        <span style="width:12px;flex-shrink:0;"></span>
        <span class="file-dot"></span>
        <span class="node-label">${esc(node.label)}</span>
      </button>`;
    const actions=document.createElement('div');
    actions.className='node-actions';
    actions.innerHTML=`
      <button class="na-btn" title="편집" onclick="openEdit('${node.id}')">✎</button>
      <button class="na-btn del" title="삭제" onclick="deleteNode('${node.id}')">✕</button>`;
    row.appendChild(inner);
    row.appendChild(actions);
  }

  // 드래그 이벤트
  row.addEventListener('dragstart', onDragStart);
  row.addEventListener('dragend',   onDragEnd);
  row.addEventListener('dragover',  onDragOver);
  row.addEventListener('dragleave', onDragLeave);
  row.addEventListener('drop',      onDrop);

  wrap.appendChild(row);

  if(node.type==='folder' && node.children?.length){
    const children=document.createElement('div');
    children.className='tree-children'+(node.open?' open':'');
    children.id='ch-'+node.id;
    node.children.forEach(c=>children.appendChild(buildNode(c,depth+1)));
    wrap.appendChild(children);
  }

  // 드롭 인디케이터 (아래)
  const dropBelow=document.createElement('div');
  dropBelow.className='drop-line';
  dropBelow.dataset.dropPos='below';
  dropBelow.dataset.targetId=node.id;
  wrap.appendChild(dropBelow);

  return wrap;
}

function esc(s){ return String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══════════════════════════════
// 드래그앤드롭
// ══════════════════════════════
let _dragId = null;          // 드래그 중인 노드 ID
let _folderHoverTimer = null; // 폴더 자동 열기 타이머

function onDragStart(e){
  _dragId = e.currentTarget.dataset.nodeId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragId);
  // 드래그 시작 후 약간 딜레이 주어 ghosting 처리
  setTimeout(()=>{
    const node = e.currentTarget.closest('.tree-node');
    if(node) node.classList.add('dragging');
  }, 0);
}

function onDragEnd(e){
  _dragId = null;
  clearFolderHover();
  // 모든 시각 피드백 초기화
  document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.drop-line.show').forEach(el=>el.classList.remove('show'));
  document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
}

function onDragOver(e){
  e.preventDefault();
  if(!_dragId) return;
  const row = e.currentTarget;
  const targetId = row.dataset.nodeId;
  if(targetId === _dragId) return;

  // 자기 자신의 자손인지 체크
  if(isDescendant(_dragId, targetId)) return;

  clearVisuals();

  const rect = row.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const h = rect.height;
  const targetR = findNode(targetId, TREE);
  if(!targetR) return;

  if(targetR.node.type === 'folder'){
    // 폴더: 상단 25% → 위에 삽입, 하단 25% → 아래에 삽입, 중간 → 폴더 안으로
    if(y < h * 0.25){
      showDropLine(targetId, 'above');
    } else if(y > h * 0.75){
      showDropLine(targetId, 'below');
    } else {
      row.classList.add('drop-target');
      // 폴더 자동 열기 (0.6초 호버)
      if(!_folderHoverTimer){
        _folderHoverTimer = setTimeout(()=>{
          const r=findNode(targetId,TREE);
          if(r&&!r.node.open){ r.node.open=true; saveTree(); renderTree(); }
        }, 600);
      }
    }
  } else {
    // 파일: 상반부 → 위, 하반부 → 아래
    if(y < h * 0.5) showDropLine(targetId, 'above');
    else showDropLine(targetId, 'below');
  }
  e.dataTransfer.dropEffect = 'move';
}

function onDragLeave(e){
  const row = e.currentTarget;
  // 자식 요소로 이동한 경우는 무시
  if(row.contains(e.relatedTarget)) return;
  clearFolderHover();
  row.classList.remove('drop-target');
}

function onDrop(e){
  e.preventDefault();
  if(!_dragId) return;
  const row = e.currentTarget;
  const targetId = row.dataset.nodeId;
  if(targetId === _dragId || isDescendant(_dragId, targetId)) return;

  const rect = row.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const h = rect.height;
  const targetR = findNode(targetId, TREE);
  if(!targetR) return;

  let dropAction; // 'before' | 'after' | 'into'
  if(targetR.node.type === 'folder'){
    if(y < h * 0.25) dropAction = 'before';
    else if(y > h * 0.75) dropAction = 'after';
    else dropAction = 'into';
  } else {
    dropAction = y < h * 0.5 ? 'before' : 'after';
  }

  moveNode(_dragId, targetId, dropAction);
  clearVisuals();
}

function showDropLine(targetId, pos){
  document.querySelectorAll('.drop-line').forEach(l=>{
    l.classList.toggle('show',
      l.dataset.targetId===targetId && l.dataset.dropPos===pos);
  });
}

function clearVisuals(){
  document.querySelectorAll('.drop-line.show').forEach(el=>el.classList.remove('show'));
  document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
}

function clearFolderHover(){
  if(_folderHoverTimer){ clearTimeout(_folderHoverTimer); _folderHoverTimer=null; }
}

// 노드가 다른 노드의 자손인지 확인
function isDescendant(ancestorId, checkId){
  const r = findNode(ancestorId, TREE);
  if(!r || r.node.type !== 'folder' || !r.node.children) return false;
  function check(nodes){
    return nodes.some(n => n.id===checkId || (n.children&&check(n.children)));
  }
  return check(r.node.children);
}

// 실제 이동 처리
function moveNode(dragId, targetId, action){
  // 원본에서 노드 제거
  const dragR = findNode(dragId, TREE);
  if(!dragR) return;
  const dragNode = JSON.parse(JSON.stringify(dragR.node));
  dragR.parentArr.splice(dragR.idx, 1);

  // 대상 위치에 삽입 (원본 제거 후 다시 찾기)
  const targetR = findNode(targetId, TREE);
  if(!targetR){ // 실패 시 원위치
    dragR.parentArr.splice(dragR.idx, 0, dragNode);
    return;
  }

  if(action === 'into'){
    if(!targetR.node.children) targetR.node.children = [];
    targetR.node.children.push(dragNode);
    targetR.node.open = true;
  } else {
    const arr = targetR.parentArr;
    const tIdx = targetR.idx;
    arr.splice(action==='before' ? tIdx : tIdx+1, 0, dragNode);
  }

  saveTree();
  renderTree();
}

// ── 폴더 토글 ──
function toggleFolder(id){
  const r=findNode(id,TREE); if(!r)return;
  r.node.open=!r.node.open;
  saveTree(); renderTree();
}

// ── 파일 로드 ──
function loadFile(id, label, url){
  _activeId=id;
  document.getElementById('top-title').textContent=label;
  document.getElementById('top-badge').textContent='';
  document.getElementById('main-frame').src=url;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  renderTree();
}

// ── 고정 메뉴 로드 ──
function fixedLoad(url,title,badge,el){
  _activeId=null;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('top-title').textContent=title;
  document.getElementById('top-badge').textContent=badge||'';
  document.getElementById('main-frame').src=url;
  renderTree();
}

// ══════════════════════════════
// 모달
// ══════════════════════════════
let _mCtx=null;
function openOverlay(html,ctx){
  _mCtx=ctx;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  _mCtx=null;
}
document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('overlay'))closeModal();
});

// ── 최상위 폴더 추가 ──
function openAddRoot(){
  openOverlay(`
    <div class="modal-title">폴더 추가</div>
    <label>이름</label>
    <input type="text" id="m-label" placeholder="예: AI 강의">
    <label>아이콘 (이모지)</label>
    <input type="text" id="m-icon" value="📁" maxlength="2">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveAddRoot()">추가</button>
    </div>`,{type:'add-root'});
  setTimeout(()=>document.getElementById('m-label')?.focus(),60);
}
function saveAddRoot(){
  const label=document.getElementById('m-label').value.trim();
  const icon=document.getElementById('m-icon').value.trim()||'📁';
  if(!label){document.getElementById('m-label').focus();return;}
  TREE.push({id:genId(),type:'folder',label,icon,open:false,children:[]});
  saveTree(); renderTree(); closeModal();
}

// ── 하위 항목 추가 ──
function openAddChild(parentId){
  openOverlay(`
    <div class="modal-title">항목 추가</div>
    <label>타입</label>
    <div class="type-row">
      <label class="type-opt"><input type="radio" name="ntype" value="folder" checked> 📁 폴더</label>
      <label class="type-opt"><input type="radio" name="ntype" value="file"> 📄 파일(링크)</label>
    </div>
    <label>이름</label>
    <input type="text" id="m-label" placeholder="항목 이름">
    <label>아이콘 (이모지)</label>
    <input type="text" id="m-icon" value="📁" maxlength="2">
    <div id="m-url-wrap" style="display:none">
      <label>URL</label>
      <input type="text" id="m-url" placeholder="예: lectures/ai.html 또는 https://...">
      <div class="modal-hint">같은 폴더 내 파일: <code>lectures/파일명.html</code><br>외부 URL: <code>https://example.com</code></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveAddChild('${parentId}')">추가</button>
    </div>`,{type:'add-child',parentId});
  // 타입 변경 시 URL 필드 토글
  setTimeout(()=>{
    document.querySelectorAll('input[name="ntype"]').forEach(r=>{
      r.addEventListener('change',()=>{
        const isFile=document.querySelector('input[name="ntype"]:checked').value==='file';
        document.getElementById('m-url-wrap').style.display=isFile?'block':'none';
        document.getElementById('m-icon').value=isFile?'📄':'📁';
      });
    });
    document.getElementById('m-label')?.focus();
  },60);
}
function saveAddChild(parentId){
  const label=document.getElementById('m-label').value.trim();
  const icon=document.getElementById('m-icon').value.trim();
  const type=document.querySelector('input[name="ntype"]:checked').value;
  const url=document.getElementById('m-url')?.value.trim()||'';
  if(!label){document.getElementById('m-label').focus();return;}
  if(type==='file'&&!url){document.getElementById('m-url').focus();return;}
  const r=findNode(parentId,TREE); if(!r)return;
  if(!r.node.children)r.node.children=[];
  const newNode={id:genId(),type,label,icon:icon||(type==='folder'?'📁':'📄')};
  if(type==='folder'){newNode.open=false;newNode.children=[];}
  else{newNode.url=url;}
  r.node.children.push(newNode);
  r.node.open=true;
  saveTree(); renderTree(); closeModal();
}

// ── 노드 편집 ──
function openEdit(id){
  const r=findNode(id,TREE); if(!r)return;
  const n=r.node;
  const isFile=n.type==='file';
  openOverlay(`
    <div class="modal-title">편집 — ${esc(n.label)}</div>
    <label>이름</label>
    <input type="text" id="m-label" value="${esc(n.label)}">
    <label>아이콘 (이모지)</label>
    <input type="text" id="m-icon" value="${esc(n.icon||'')}" maxlength="2">
    ${isFile?`
    <label>URL</label>
    <input type="text" id="m-url" value="${esc(n.url||'')}">
    <div class="modal-hint">같은 폴더 내 파일: <code>lectures/파일명.html</code><br>외부 URL: <code>https://example.com</code></div>
    `:''}
    <div class="modal-actions">
      <button class="btn-del" onclick="deleteNode('${id}')">삭제</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEdit('${id}')">저장</button>
    </div>`,{type:'edit',id});
  setTimeout(()=>document.getElementById('m-label')?.focus(),60);
}
function saveEdit(id){
  const r=findNode(id,TREE); if(!r)return;
  const n=r.node;
  n.label=document.getElementById('m-label').value.trim()||n.label;
  n.icon=document.getElementById('m-icon').value.trim()||n.icon;
  if(n.type==='file') n.url=document.getElementById('m-url').value.trim();
  saveTree(); renderTree(); closeModal();
}

// ── 노드 삭제 ──
function deleteNode(id){
  if(!confirm('삭제할까요? 하위 항목도 모두 삭제됩니다.'))return;
  function removeFrom(nodes){
    const idx=nodes.findIndex(n=>n.id===id);
    if(idx>-1){nodes.splice(idx,1);return true;}
    return nodes.some(n=>n.children&&removeFrom(n.children));
  }
  removeFrom(TREE);
  if(_activeId===id)_activeId=null;
  saveTree(); renderTree(); closeModal();
}

  openOverlay(`
    <div class="modal-title">GitHub 내보내기</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">아래 내용을 복사해서 dashboard.html의 DEFAULT_TREE 부분에 붙여넣고 GitHub에 커밋하세요.</p>
    <textarea class="export-box" readonly id="export-box">${snippet}</textarea>
    <div class="copy-tip" id="copy-tip"></div>

function copyExport(){

  box.select();
  document.execCommand('copy');

}

function logout(){
  sessionStorage.removeItem('vc_auth');
  window.location.href='admin.html';
}

  if(e.key==='Enter'&&e.target.tagName==='INPUT'){
    const s=document.querySelector('#modal-body .btn-save');
    if(s)s.click();

renderTree();
